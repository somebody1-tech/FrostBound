<style>

</style></head><body><canvas id="c" width="960" height="576"></canvas>
<script>
const cv=document.getElementById('c');let g=cv.getContext('2d');const gMain=g,tc=document.createElement('canvas');tc.width=480;tc.height=288;const tg=tc.getContext('2d');g.imageSmoothingEnabled=false;
const VW=320,VH=192,T=16;
function fit(){const s=Math.min(innerWidth/VW,innerHeight/VH),k=s;cv.style.width=VW*k+'px';cv.style.height=VH*k+'px'}
addEventListener('resize',fit);fit();

/* ---------- level ---------- */
let W=48,map=[];const H=12;
const fill=(a,b,c,d)=>{for(let y=b;y<=d;y++)for(let x=a;x<=c;x++)map[y][x]=1};
const LEVELS=[{W:120,goal:[-999,-999],npc:1,flowers:1,spikes:[90,93,102,105,108],flag:97,build(){fill(0,10,11,11);fill(14,10,25,11);fill(28,10,47,11);   // ground (pits at 12-13 and 25-27)
fill(5,9,6,9);fill(8,8,9,8);                            // first steps
fill(16,9,17,9);fill(19,8,20,8);fill(22,7,23,7);                        // floating ice
fill(32,9,33,9);fill(35,8,36,8);fill(38,7,39,7);fill(42,9,43,9);const o=48;fill(o,10,o+9,11);fill(o+12,10,o+21,11);fill(o+24,10,o+35,11);fill(o+15,9,o+16,9);fill(o+18,8,o+19,8);fill(o+26,8,o+27,8);fill(o+29,9,o+30,9);fill(84,10,113,11);fill(116,10,119,11)}}];
function loadLevel(n){cur=n;const L=LEVELS[n];W=L.W;map=[];for(let y=0;y<H;y++)map.push(new Array(W).fill(0));L.build();GOAL={x:L.goal[0]*T+8,y:L.goal[1]*T-10};NPCon=!!L.npc;flowers=[];spikes=(L.spikes||[]).map(c=>({x:c*T,y:10*T}));flag=L.flag?{x:L.flag*T,y:10*T}:null;
if(L.flowers){const r=rng(40+n);for(let y=1;y<H;y++)for(let x=48;x<W;x++)if(map[y][x]===1&&map[y-1][x]===0&&((x>=49&&x<=56)||(x>=61&&x<=68)||(x>=74&&x<=82)))for(let k=0;k<3;k++)if(r()<.75)flowers.push({x:x*T+1+Math.floor(r()*14),y:y*T,s:r()*6})}}
        // late section
let GOAL={x:0,y:0},cur=0,fade=0,fdir=0,flowers=[],NPCon=true,camS=0,dead=0,parts=[],cpOn=false,CP={x:0,y:0},spikes=[],flag=null,puffs=[];
const solid=(x,y)=>x<0||x>=W?true:(y<0||y>=H)?false:map[y][x]===1;

/* ---------- sprites ---------- */
const pal={R:'#d0343f',L:'#ee5a68',D:'#8a1a28',K:'#1a0f1c',W:'#ffffff',F:'#fff1dc',C:'#e8607a',S:'#f2a93b',s:'#c97a1f',B:'#5a3524'};
const body=["....FF....","...RRRR...","..RRLRRR..","..FKKKKF..","..FKWKWF..","..FCKKCF..","..RRRRRR..",".SSSSSSSS.",".RRSSRRRR.",".RRsSRRRR.","RRRRRRRRRR","RDRRRRRRDR"];
const hems={idle:["FFFFFFFFFF",".BBB..BBB."],walk1:["FFFFFFFFFF","BB.....BBB"],walk2:[".FFFFFFFF.",".BBB..BB.."],jump:[".FFFFFFFF.","..BBBBBB.."]};
function mk(rows,flip){const c=document.createElement('canvas');c.width=10;c.height=14;const x=c.getContext('2d');
rows.forEach((r,y)=>{for(let i=0;i<10;i++){const ch=r[flip?9-i:i];if(ch!=='.'){x.fillStyle=pal[ch];x.fillRect(i,y,1,1)}}});return c}
const spr={};for(const k in hems){const rows=body.concat(hems[k]);spr[k]=[mk(rows,true),mk(rows,false)]} // [left,right]

/* ---------- caped air poses (the coat billows out like a parachute) ---------- */
function mkw(rows,flip,wd){const c=document.createElement('canvas');c.width=wd;c.height=14;const x=c.getContext('2d');rows.forEach((r,y)=>{for(let i=0;i<wd;i++){const ch=r[flip?wd-1-i:i];if(ch&&ch!=='.'){x.fillStyle=pal[ch];x.fillRect(i,y,1,1)}}});return c}
const topR=body.slice(0,10).map(r=>'..'+r+'..');
const air={rise:["...RRRRRRRR...","..RRRRRRRRRR..","..FFFFFFFFFF..","...BB....BB..."],fallA:["..RRRRRRRRRR..",".RRRRRRRRRRRR.",".FFFFFFFFFFFF.","...BB....BB..."],fallB:["...RRRRRRRR...",".RRRRRRRRRRRR.","..FFFFFFFFFF..","...BB....BB..."]};
for(const k in air){const rows=topR.concat(air[k]);spr[k]=[mkw(rows,true,14),mkw(rows,false,14)]}

/* ---------- layered scenery: sky, mountains, pine forests ---------- */
function mkLayer(f,fn){const c=document.createElement('canvas'),w=Math.ceil(VW+1700*f);c.width=w;c.height=VH;fn(c.getContext('2d'),w);return c}
function ridge(b,w,col,snow,base,lo,hi,seed){const r=rng(seed),pk=[];for(let x=-30;x<w+60;x+=55+r()*50)pk.push([x,lo+r()*(hi-lo),1.1+r()*.7]);const thr=hi*.55;
for(let x=0;x<w;x++){let best=0,bi=0;pk.forEach((p,i)=>{const v=p[1]-Math.abs(x-p[0])*p[2];if(v>best){best=v;bi=i}});
const top=Math.round(base-best),rt=x>pk[bi][0];b.fillStyle=rt?col[1]:col[0];b.fillRect(x,top,1,VH-top);
const sd=Math.round((best-thr)*.9)+(x%7===0?1:0);if(best>thr&&sd>0){b.fillStyle=rt?snow[1]:snow[0];b.fillRect(x,top,1,sd)}}
const gr=b.createLinearGradient(0,base-70,0,base+15);gr.addColorStop(0,'rgba(236,214,206,0)');gr.addColorStop(1,'rgba(236,214,206,.55)');b.fillStyle=gr;b.fillRect(0,base-70,w,VH)}
function pine(b,x,by,h,col){b.fillStyle=col;const hw=h*.28;for(let r=0;r<h;r++){const w=Math.max(1,Math.round(1+r/h*hw)-(r%6===5?2:0));b.fillRect(x-w,by-h+r,w*2+1,1)}b.fillRect(x,by,1,6)}
function forest(b,w,col,by,lo,hi,gap,seed){const r=rng(seed);b.fillStyle=col;b.fillRect(0,by,w,VH-by);for(let x=-4;x<w+4;x+=gap*(.6+r()*.8))pine(b,Math.round(x),by,Math.round(lo+r()*(hi-lo)),col)}
const LAY=[[mkLayer(.03,(b,w)=>{const lg=b.createLinearGradient(0,0,0,150);lg.addColorStop(0,'#2a62a3');lg.addColorStop(.6,'#8cc0e6');lg.addColorStop(1,'#f4d9c4');b.fillStyle=lg;b.fillRect(0,0,w,VH);const r=rng(5);for(let i=0;i<6;i++){const x=r()*w,y=12+r()*70,cw=40+r()*50;b.fillStyle='rgba(255,255,255,.3)';[[.5,0],[.8,3],[1,6],[.75,9]].forEach(([k,o])=>b.fillRect(x+cw*(1-k)/2,y+o,cw*k,3))}}),.03],
[mkLayer(.12,(b,w)=>ridge(b,w,['#7aa8d2','#6896c0'],['#fff3e8','#d9d4ee'],140,40,85,3)),.12],
[mkLayer(.25,(b,w)=>ridge(b,w,['#3a86b6','#2f74a3'],['#e4f6ff','#b7e2f4'],165,30,62,9)),.25],
[mkLayer(.45,(b,w)=>forest(b,w,'#2a7aa8',150,22,44,9,21)),.45],
[mkLayer(.7,(b,w)=>forest(b,w,'#175a86',178,34,64,16,33)),.7]];
function drawBg(cx){g.imageSmoothingEnabled=false;for(const [c,f] of LAY)g.drawImage(c,-Math.round(cx*f),0)}

/* ---------- background ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const BGW=520,bg=document.createElement('canvas');bg.width=BGW;bg.height=VH;
{const b=bg.getContext('2d'),r=rng(7);const lg=b.createLinearGradient(0,0,0,VH);lg.addColorStop(0,'#1a73b0');lg.addColorStop(1,'#3cb4e8');b.fillStyle=lg;b.fillRect(0,0,BGW,VH);
for(let i=0;i<0;i++){const w=14+r()*30|0,h=8+r()*16|0,x=r()*BGW|0,y=r()*VH|0,lt=r()<.5;
b.fillStyle=lt?'#46bde8':'#1a76ad';b.fillRect(x,y,w,h);b.fillStyle=lt?'#a4ecfb':'#2f9ccf';b.fillRect(x,y,w,2);b.fillStyle=lt?'#2e9fd0':'#145f94';b.fillRect(x,y+h-2,w,2)}}

/* ---------- tiles ---------- */
function tile(x,y,top,h){
g.fillStyle='#62cdf0';g.fillRect(x,y,T,T);
g.fillStyle='#8fe3f7';g.fillRect(x,y,2,T);
g.fillStyle='#3fb0dc';g.fillRect(x,y+T-3,T,3);g.fillRect(x+T-2,y,2,T);g.fillRect(x,y+8,T,1);
g.fillRect(x+(h&1?4:11),y+1,1,7);g.fillRect(x+(h&1?11:4),y+9,1,4);
g.fillStyle='#b4f0ff';g.fillRect(x+(h&2?6:9),y+10,3,1);
if(top){g.fillStyle='#f4fdff';g.fillRect(x,y,T,3);g.fillStyle='#d2f6ff';g.fillRect(x,y+3,T,1);
if(h&4)g.fillRect(x+3,y+4,3,1);if(h&8)g.fillRect(x+10,y+4,2,2);if(((tick>>3)+h)%28===0){g.fillStyle='#fff';g.fillRect(x+h%12+2,y-1,1,3);g.fillRect(x+h%12+1,y,3,1)}}}

/* ---------- player & input ---------- */
const keys={};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();initAudio();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(e.repeat)return;keys[k]=true;if(k==='r')restart(won);if(k==='m')toggleMute();if(k==='f'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}if(dlg&&(k===' '||k==='enter'||k==='e'))advance()});
function npcHit(e){if(!NPCon)return false;const r=cv.getBoundingClientRect(),s=VW/r.width,mx=(e.clientX-r.left)*s+camX,my=(e.clientY-r.top)*s;return mx>NPC.x-4&&mx<NPC.x+NPC.w+4&&my>NPC.y-8&&my<NPC.y+NPC.h+2}
cv.addEventListener('pointerdown',e=>{initAudio();if(dlg)advance();else if(npcHit(e))startDlg()});
cv.addEventListener('pointermove',e=>{cv.style.cursor=npcHit(e)&&!dlg?'pointer':'default'});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
const P={x:0,y:0,vx:0,vy:0,w:8,h:14,face:1,on:false,coy:0,buf:0,anim:0},clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let prevJ=false,won=false,time=0,tick=0,dlg=null,camX=0,lastFr=0;
const flakes=Array.from({length:320},()=>{const q=Math.random(),z=q<.08?3:q<.3?2:1;return{x:Math.random()*VW,y:Math.random()*VH,s:(.2+Math.random()*.5)*(z===3?1.6:z===2?1.1:.8),z,ph:Math.random()*6}});
function restart(full){if(full){cur=0;time=0;tick=0;fade=0;fdir=0;cpOn=false}loadLevel(cur);P.x=cpOn?CP.x:2*T+4;P.y=cpOn?CP.y:8*T;P.vx=P.vy=0;P.face=1;P.open=0;dlg=null;won=false;dead=0;parts=[];camS=clamp(P.x+4-VW/2,0,W*T-VW)}
restart();

function colX(){const y0=Math.floor(P.y/T),y1=Math.floor((P.y+P.h-.01)/T);
if(P.vx>0){const tx=Math.floor((P.x+P.w)/T);for(let y=y0;y<=y1;y++)if(solid(tx,y)){P.x=tx*T-P.w-.001;P.vx=0;break}}
else if(P.vx<0){const tx=Math.floor(P.x/T);for(let y=y0;y<=y1;y++)if(solid(tx,y)){P.x=(tx+1)*T;P.vx=0;break}}}
function colY(){const x0=Math.floor(P.x/T),x1=Math.floor((P.x+P.w-.01)/T);P.on=false;
if(P.vy>=0){const ty=Math.floor((P.y+P.h)/T);for(let x=x0;x<=x1;x++)if(solid(x,ty)){P.y=ty*T-P.h;P.vy=0;P.on=true;break}}
else{const ty=Math.floor(P.y/T);for(let x=x0;x<=x1;x++)if(solid(x,ty)){P.y=(ty+1)*T;P.vy=0;break}}}

function step(){
tick++;if(!won)time++;
const L=keys.a||keys.arrowleft,R=keys.d||keys.arrowright,J=keys.w||keys.arrowup||keys[' '];
const ax=(won||dlg||dead||fdir>0)?0:(R?1:0)-(L?1:0);
if(ax){P.vx+=ax*(P.on?.24:.16);P.face=ax}else{const f=P.on?.12:.04;P.vx=Math.abs(P.vx)<f?0:P.vx-Math.sign(P.vx)*f}
P.vx=clamp(P.vx,-1.35,1.35);
if(J&&!prevJ&&!dlg)P.buf=6;else if(P.buf>0)P.buf--;prevJ=!!J;
P.coy=P.on?6:P.coy-1;
if(!won&&!dead&&P.buf>0&&P.coy>0){P.vy=-4.8;P.buf=0;P.coy=0;P.on=false;sfx('jump')}
if(!J&&P.vy<-2)P.vy=-2;
P.vy=Math.min(P.vy+.32,6);
if(dead){P.vx=P.vy=0}const was=P.on,vyb=P.vy;P.x+=P.vx;colX();P.y+=P.vy;colY();
if(!was&&P.on&&vyb>2){sfx('land');kick(7)}
if(!P.on&&P.vy>-.5){if(P.open===0)sfx('open');P.open=Math.min(1,P.open+.12)}else if(P.on)P.open=0;
const fr=Math.floor(P.anim);if(P.on&&P.anim>0&&fr!==lastFr&&fr%2===0){sfx('step');kick(2)}lastFr=fr;
if(dlg)typeStep();
if(Math.abs(P.vx)>.2&&P.on)P.anim+=Math.abs(P.vx)*.1;else if(P.on)P.anim=0;
if(P.y>H*T+40)die(1);
if(!won&&!fdir&&Math.abs(P.x+4-GOAL.x)<10&&Math.abs(P.y+7-GOAL.y)<12)goalHit();
if(dead){dead++;for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.15}if(dead===36)fdir=1}
else{for(const s of spikes)if(P.x<s.x+13&&P.x+P.w>s.x+3&&P.y+P.h>s.y-9&&P.y<s.y){die();break}
if(flag&&!cpOn&&P.x<flag.x+12&&P.x+P.w>flag.x+2&&P.y+P.h>flag.y-22&&P.y<flag.y){cpOn=true;CP={x:flag.x+4,y:flag.y-14};sfx('flag')}}
if(fdir){fade+=fdir/45;if(fade>=1){fade=1;fdir=-1;restart()}else if(fade<=0){fade=0;fdir=0}}
for(const f of flakes){f.y+=f.s;f.x+=Math.sin(tick*.02+f.ph)*.25-.1*f.s+gust()*.17*f.z;if(f.x<0)f.x+=VW;if(f.x>VW)f.x-=VW;if(f.y>VH){f.y=-3;f.x=Math.random()*VW}}for(const p of puffs){p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.l--}puffs=puffs.filter(p=>p.l>0)}

/* ---------- shader-style post effects ---------- */
const vig=document.createElement('canvas');vig.width=VW;vig.height=VH;
{const v=vig.getContext('2d'),r=v.createRadialGradient(VW/2,VH/2,VH*.35,VW/2,VH/2,VW*.62);r.addColorStop(0,'rgba(0,20,60,0)');r.addColorStop(1,'rgba(30,12,48,.42)');v.fillStyle=r;v.fillRect(0,0,VW,VH)}
const sm=document.createElement('canvas');sm.width=80;sm.height=48;const sg=sm.getContext('2d');
function glow(x,y,r,c,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${c},${a})`);gr.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
function fx(cx){
g.globalCompositeOperation='lighter';

glow(GOAL.x-cx,GOAL.y,30,'255,225,120',.25+Math.sin(tick*.06)*.05);
g.globalCompositeOperation='source-over';
sg.imageSmoothingEnabled=true;sg.drawImage(cv,0,0,80,48);
g.imageSmoothingEnabled=true;g.globalCompositeOperation='screen';g.globalAlpha=.28;g.drawImage(sm,0,0,VW,VH);
g.globalAlpha=1;g.globalCompositeOperation='source-over';g.imageSmoothingEnabled=false;
g.fillStyle='rgba(255,196,130,.11)';g.fillRect(0,0,VW,VH);g.imageSmoothingEnabled=true;g.drawImage(vig,0,0);g.imageSmoothingEnabled=false;g.fillStyle='rgba(0,20,50,.05)';for(let y=0;y<VH;y+=2)g.fillRect(0,y,VW,1)}
/* ---------- audio (synthesized, no files) ---------- */
let AC=null,master,wet,nb,muted=false;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
master=AC.createGain();master.gain.value=muted?0:.8;master.connect(AC.destination);
const dl=AC.createDelay(),fb=AC.createGain(),wg=AC.createGain();dl.delayTime.value=.33;fb.gain.value=.4;wg.gain.value=.5;
wet=AC.createGain();wet.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wg);wg.connect(master);
nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
const w=AC.createBufferSource();w.buffer=nb;w.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=260;bp.Q.value=.4;
const wv=AC.createGain();wv.gain.value=.05;
const l1=AC.createOscillator(),l1g=AC.createGain();l1.frequency.value=.07;l1g.gain.value=220;l1.connect(l1g);l1g.connect(bp.frequency);
const l2=AC.createOscillator(),l2g=AC.createGain();l2.frequency.value=.12;l2g.gain.value=.04;l2.connect(l2g);l2g.connect(wv.gain);
w.connect(bp);bp.connect(wv);wv.connect(master);w.start();l1.start();l2.start();pad();hush();chimeLoop()}
function chimeLoop(){const n=[523,587,659,784,880,1047];tone(n[Math.random()*n.length|0],0,3,'sine',.04,1);if(Math.random()<.4)setTimeout(()=>tone(n[Math.random()*n.length|0],0,3,'sine',.03,1),500);setTimeout(chimeLoop,5000+Math.random()*7000)}
function pad(){[110,165,220].forEach((f,i)=>{const o=AC.createOscillator(),v=AC.createGain();o.type='sine';o.frequency.value=f*(1+i*.002);v.gain.value=.012;o.connect(v);v.connect(master);o.start()})}
function hush(){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),v=AC.createGain();s.buffer=nb;s.loop=true;f.type='highpass';f.frequency.value=3500;v.gain.value=.006;s.connect(f);f.connect(v);v.connect(master);s.start()}
function tone(f0,f1,dur,type,vol,wt){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1>0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(vol,t+.008);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(v);v.connect(master);if(wt)v.connect(wet);o.start(t);o.stop(t+dur+.05)}
function puff(dur,fc,vol,ft){if(!AC||muted)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),v=AC.createGain();s.buffer=nb;f.type=ft;f.frequency.value=fc;v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(v);v.connect(master);s.start(t,Math.random()*1.5);s.stop(t+dur+.02)}
function sfx(n){({jump:()=>tone(320,720,.13,'sine',.12),land:()=>{tone(150,55,.14,'sine',.28);puff(.12,700,.18,'lowpass')},open:()=>{puff(.22,900,.1,'bandpass');tone(500,900,.15,'triangle',.05,1)},step:()=>{puff(.09,1800,.07,'bandpass');puff(.12,450,.05,'lowpass')},click:()=>tone(900,600,.05,'triangle',.08),adv:()=>tone(600,400,.06,'triangle',.08),open2:()=>tone(520,780,.08,'triangle',.08),close:()=>tone(500,300,.1,'triangle',.07),die:()=>{tone(420,70,.45,'triangle',.18);puff(.3,1500,.14,'bandpass')},flag:()=>{tone(660,0,1.6,'sine',.07,1);setTimeout(()=>tone(990,0,1.8,'sine',.05,1),180)}}[n]||(()=>{}))()}

const DF='bold 9px monospace';
function wrap(t,mw){g.font=DF;const out=[];let cur='';for(const w of t.split(' ')){const nx=cur?cur+' '+w:w;if(g.measureText(nx).width>mw&&cur){out.push(cur);cur=w}else cur=nx}out.push(cur);return out}
function setLine(i){dlg={i,n:0,wait:0,ls:wrap(LINES[i].t,206),tot:LINES[i].t.length}}
function startDlg(){P.face=NPC.x>P.x?1:-1;sfx('open2');LINES=died?LINES3:talked?LINES2:LINES1;died=false;setLine(0)}
function advance(){if(dlg.n<dlg.tot){dlg.n=dlg.tot;sfx('click')}else if(dlg.i<LINES.length-1){sfx('adv');setLine(dlg.i+1)}else{sfx('close');dlg=null;if(LINES===LINES1)talked=true}}
function typeStep(){if(dlg.n>=dlg.tot)return;if(dlg.wait>0){dlg.wait--;return}if(tick%2)return;const ch=LINES[dlg.i].t[dlg.n];dlg.n++;
if(ch!==' '){LINES[dlg.i].w?tone(520+Math.random()*130,0,.05,'sine',.07):tone(170+Math.random()*70,0,.07,'triangle',.07)}
if('.?!,'.includes(ch))dlg.wait=6}
function drawDlg(){g.textAlign='center';g.font='bold 10px monospace';if(!dlg)return;
const L=LINES[dlg.i],x=10,y=126,w=300,h=56,bob=Math.round(Math.sin(tick*.15)*1.5);
g.fillStyle='rgba(30,24,46,.93)';g.fillRect(x+1,y,w-2,h);g.fillRect(x,y+1,w,h-2);

{const im=PORT[L.w],tb=(dlg.n<dlg.tot&&(tick>>2)%2)?-1:0;g.fillStyle='rgba(255,255,255,.07)';g.fillRect(x+5,y+4,54,h-8);if(im.complete&&im.width){const w2=im.width*2,h2=im.height*2;g.drawImage(im,x+5+((54-w2)>>1),y+h-4-h2+tb,w2,h2)}}g.fillStyle=L.w?'#ff9aa6':'#8ff0a8';g.fillRect(x+66,y-7,L.w?24:52,9);g.fillStyle='#06203a';g.textAlign='left';g.font='bold 8px monospace';g.fillText(L.w?'You':'Stranger',x+69,y);
g.font=DF;g.fillStyle='#e8fbff';let rem=dlg.n,ly=y+22,ex=0,ey=0;
for(const s of dlg.ls){const t=s.slice(0,Math.max(0,Math.min(rem,s.length)));g.fillText(t,x+68,ly);ex=x+68+g.measureText(t).width;ey=ly;rem-=s.length+1;ly+=12}
if(dlg.n>=dlg.tot){if(L.arrow){const ax=Math.round(ex+6+bob);g.fillStyle='#ffe66b';g.fillRect(ax,ey-5,7,2);g.fillRect(ax+5,ey-8,1,8);g.fillRect(ax+6,ey-7,1,6);g.fillRect(ax+7,ey-6,1,4);g.fillRect(ax+8,ey-5,1,2)}
else{g.fillStyle='#a4ecfb';const bx=x+w-14,by=y+h-12+bob;g.fillRect(bx,by,7,1);g.fillRect(bx+1,by+1,5,1);g.fillRect(bx+2,by+2,3,1);g.fillRect(bx+3,by+3,1,1)}}
g.textAlign='center';g.font='bold 10px monospace'}
function spike(x,y){[[3,5,10],[8,6,12],[13,4,8]].forEach(([cx,bw,h])=>{for(let i=0;i<h;i++){const w=Math.max(1,Math.ceil(bw*(1-i/h)));g.fillStyle=i%5===4?'#2d6fc4':'#4f9cff';g.fillRect(cx+x-(w>>1),y-1-i,w,1);g.fillStyle='#d8f2ff';g.fillRect(cx+x-(w>>1),y-1-i,1,1)}});if(((tick>>4)+x)%9===0){g.fillStyle='#fff';g.fillRect(x+8,y-12,1,1)}}
function drawFlag(x,y){g.fillStyle='#cfe3f2';g.fillRect(x+3,y-24,2,24);g.fillStyle='#fff';g.fillRect(x+3,y-26,2,2);g.fillStyle=cpOn?'#8fd0ff':'#3f8cff';for(let i=0;i<10;i++){const yy=Math.round(Math.sin(tick*.1+i*.5));g.fillRect(x+5+i,y-24+yy+(i>>2),1,7-(i>>1))}

function kick(n){for(let i=0;i<n;i++)puffs.push({x:P.x+4+(Math.random()-.5)*8,y:P.y+P.h-1,vx:(Math.random()-.5)*.8,vy:-.2-Math.random()*.5,l:24})}
function flower(x,y,s){const w=gust()*2.2+Math.sin(tick*.12+s)*.7,hx=x+Math.round(w),mx=x+Math.round(w*.5);g.fillStyle='#3f9b5a';g.fillRect(x,y-1,1,1);g.fillRect(mx,y-2,1,1);g.fillStyle=s>3?'#7c9bff':'#4f74ff';g.fillRect(hx-1,y-4,3,1);g.fillRect(hx,y-5,1,3);g.fillStyle='#ffe66b';g.fillRect(hx,y-4,1,1)}

for(const f of flowers){const fx=f.x-cx;if(fx>-8&&fx<VW+8)flower(fx,f.y,f.s)}
for(const s of spikes){const sx=s.x-cx;if(sx>-16&&sx<VW)spike(sx,s.y)}
if(flag)drawFlag(flag.x-cx,flag.y);
// goal crystal
const gy=GOAL.y+Math.round(Math.sin(tick*.06)*2),gx=GOAL.x-cx;
g.fillStyle='rgba(255,240,150,.25)';g.fillRect(gx-8,gy-8,16,16);
[[2,-6],[4,-5],[6,-4],[8,-3],[6,-2],[4,-1],[2,0]].forEach(([w,o],i)=>{g.fillStyle=i<3?'#fff6b0':'#ffd23f';g.fillRect(gx-w/2,gy+i-3,w,1)});
camX=cx;drawNpc(cx);
// player
const st=!P.on?(P.vy<0?'rise':(tick>>3)%2?'fallB':'fallA'):P.anim>0?(Math.floor(P.anim)%2?'walk1':'walk2'):'idle';
if(!dead)g.drawImage(spr[st][P.face>0?1:0],Math.round(P.x-(P.on?1:3)-cx),Math.round(P.y)-(st==='walk1'?1:0));for(const p of parts){g.fillStyle=p.c;g.fillRect(Math.round(p.x-cx),Math.round(p.y),2,2)}
// snow
for(const f of flakes){const tw=f.z===1&&((tick+f.ph*17|0)%60<3);g.fillStyle=tw?'#fff':'rgba(255,248,235,'+(f.z===3?.4:f.z===2?.95:.6)+')';g.fillRect(Math.round(f.x),Math.round(f.y),f.z,f.z)}
for(const p of puffs){g.fillStyle='rgba(255,255,255,'+(p.l/24*.8)+')';g.fillRect(Math.round(p.x-cx),Math.round(p.y),2,2)}
fx(cx);
g=tg;g.setTransform(1.5,0,0,1.5,0,0);g.clearRect(0,0,VW,VH);g.imageSmoothingEnabled=false;g.textAlign='center';g.font='bold 10px monospace';
{const a=tick<240?1:Math.max(0,1-(tick-240)/90);if(a>0&&!won){g.globalAlpha=a;g.fillStyle='rgba(0,25,45,.55)';g.fillRect(48,6,224,16);g.fillStyle='#e8fbff';g.font='bold 9px monospace';g.fillText('WASD to move, left click to interact',160,17);g.globalAlpha=1}}
drawDlg();if(won){g.fillStyle='rgba(0,25,45,.65)';g.fillRect(0,0,VW,VH);g.fillStyle='#ffe66b';g.font='bold 18px monospace';g.fillText('LEVEL COMPLETE',160,84);
g.fillStyle='#e8fbff';g.font='bold 10px monospace';g.fillText('Time: '+(time/60).toFixed(1)+'s',160,102);g.fillText('Press R to play again',160,118)}g=gMain;g.imageSmoothingEnabled=false;g.drawImage(tc,0,0,VW,VH);if(fade>0){const e=fade*fade*(3-2*fade);g.fillStyle='rgba(0,0,0,'+e+')';g.fillRect(0,0,VW,VH)}}

let last=0,acc=0;
function loop(t){acc+=Math.min(t-last,100);last=t;while(acc>=1000/60){step();acc-=1000/60}draw();requestAnimationFrame(loop)}
requestAnimationFrame(t=>{last=t;loop(t)});
