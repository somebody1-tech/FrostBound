const air={rise:["...RRRRRRRR...","..RRRRRRRRRR..","..FFFFFFFFFF..","...BB....BB..."],fallA:["..RRRRRRRRRR..",".RRRRRRRRRRRR.",".FFFFFFFFFFFF.","...BB....BB..."],fallB:["...RRRRRRRR...",".RRRRRRRRRRRR.","..FFFFFFFFFF..","...BB....BB..."]};

/* ---------- layered scenery: sky, mountains, pine forests ---------- */
function mkLayer(f,fn){const c=document.createElement('canvas'),w=Math.ceil(VW+3520*f);c.width=w;c.height=VH;fn(c.getContext('2d'),w);return c}

{const b=bg.getContext('2d'),r=rng(7);const lg=b.createLinearGradient(0,0,0,VH);lg.addColorStop(0,'#1a73b0');lg.addColorStop(1,'#3cb4e8');b.fillStyle=lg;b.fillRect(0,0,BGW,VH);

const P={x:0,y:0,vx:0,vy:0,w:8,h:14,face:1,on:false,coy:0,buf:0,anim:0},clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function restart(full){if(full){cur=0;time=0;tick=0;fade=0;fdir=0;cpOn=false;fon=[];snap=null}loadLevel(cur);if(snap){talked=snap.t;gave=snap.g;lantern=snap.l}else{talked=false;gave=false;lantern=false}P.x=cpOn?CP.x:2*T+4;P.y=cpOn?CP.y:8*T;P.vx=P.vy=0;P.face=1;P.open=0;dlg=null;cine=null;give=null;rg=null;won=false;dead=0;parts=[];camS=clamp(P.x+4-VW/2,0,W*T-VW)}
restart();

function colX(){const y0=Math.floor(P.y/T),y1=Math.floor((P.y+P.h-.01)/T);
if(P.vx>0){const tx=Math.floor((P.x+P.w)/T);for(let y=y0;y<=y1;y++)if(solid(tx,y)){P.x=tx*T-P.w-.001;P.vx=0;break}}
else if(P.vx<0){const tx=Math.floor(P.x/T);for(let y=y0;y<=y1;y++)if(solid(tx,y)){P.x=(tx+1)*T;P.vx=0;break}}}
function colY(){const x0=Math.floor(P.x/T),x1=Math.floor((P.x+P.w-.01)/T);P.on=false;
if(P.vy>=0){const ty=Math.floor((P.y+P.h)/T);for(let x=x0;x<=x1;x++)if(solid(x,ty)){P.y=ty*T-P.h;P.vy=0;P.on=true;break}}
else{const ty=Math.floor(P.y/T);for(let x=x0;x<=x1;x++)if(solid(x,ty)){P.y=(ty+1)*T;P.vy=0;break}}}

function step(){
tick++;if(!won)time++;
const L=keys.a||keys.arrowleft,R=keys.d||keys.arrowright,J=keys.w||keys.arrowup||keys[' '];
const ax=(won||dlg||dead||fdir>0||give||rg||(cine&&cine.p<2))?0:(R?1:0)-(L?1:0);
if(ax){P.vx+=ax*(P.on?.3:.16);P.face=ax}else{const f=P.on?.26:.05;P.vx=Math.abs(P.vx)<f?0:P.vx-Math.sign(P.vx)*f}

P.coy=P.on?6:P.coy-1;
if(!won&&!dead&&P.buf>0&&P.coy>0){P.vy=-4.8;P.buf=0;P.coy=0;P.on=false;sfx('jump')}
if(!J&&P.vy<-2)P.vy=-2;
P.vy=Math.min(P.vy+.32,6);

if(!P.on&&P.vy>-.5){if(P.open===0)sfx('open');P.open=Math.min(1,P.open+.12)}else if(P.on)P.open=0;
const fr=Math.floor(P.anim);if(P.on&&P.anim>0&&fr!==lastFr&&fr%2===0){sfx('step');kick(2)}lastFr=fr;idleT=(P.on&&Math.abs(P.vx)<.05&&!ax&&!dead)?idleT+1:0;

for(const f of flakes){f.y+=f.s;f.x+=Math.sin(tick*.02+f.ph)*.25-.1*f.s+gust()*.17*f.z;if(f.x<0)f.x+=VW;if(f.x>VW)f.x-=VW;if(f.y>VH){f.y=-3;f.x=Math.random()*VW}}for(const p of puffs){p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.l--}puffs=puffs.filter(p=>p.l>0);cineStep();lanternStep();if(tick%6===0)ambTick();for(const f of flowers)if(f.t===3&&Math.abs(f.x-camS-160)<190&&Math.random()<.012&&motes.length<160)motes.push({x:f.x+1,y:f.y-4,vx:.25+Math.random()*.3,vy:-.1-Math.random()*.3,l:70+(Math.random()*50|0)});for(const m of motes){m.x+=m.vx+gust()*.35;m.y+=m.vy+Math.sin((tick+m.l)*.1)*.05;m.vy+=.003;m.l--}motes=motes.filter(m=>m.l>0)}

const vig=document.createElement('canvas');vig.width=VW;vig.height=VH;
{const v=vig.getContext('2d'),r=v.createRadialGradient(VW/2,VH/2,VH*.35,VW/2,VH/2,VW*.62);r.addColorStop(0,'rgba(0,20,60,0)');r.addColorStop(1,'rgba(30,12,48,.42)');v.fillStyle=r;v.fillRect(0,0,VW,VH)}

/* ---------- audio (synthesized, no files) ---------- */
let AC=null,master,wet,nb,muted=false,windV,windF;

function chimeLoop(){const n=[523,587,659,784,880,1047];tone(n[Math.random()*n.length|0],0,3,'sine',.06,1);if(Math.random()<.4)setTimeout(()=>tone(n[Math.random()*n.length|0],0,3,'sine',.03,1),500);setTimeout(chimeLoop,5000+Math.random()*7000)}
function pad(){[110,165,220].forEach((f,i)=>{const o=AC.createOscillator(),v=AC.createGain();o.type='sine';o.frequency.value=f*(1+i*.002);v.gain.value=.02;o.connect(v);v.connect(master);o.start()})}
function hush(){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),v=AC.createGain();s.buffer=nb;s.loop=true;f.type='highpass';f.frequency.value=3500;v.gain.value=.014;s.connect(f);f.connect(v);v.connect(master);s.start()}
function tone(f0,f1,dur,type,vol,wt){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1>0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(vol,t+.008);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(v);v.connect(master);if(wt)v.connect(wet);o.start(t);o.stop(t+dur+.05)}
function puff(dur,fc,vol,ft){if(!AC||muted)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),v=AC.createGain();s.buffer=nb;f.type=ft;f.frequency.value=fc;v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(v);v.connect(master);s.start(t,Math.random()*1.5);s.stop(t+dur+.02)}

0}

{const a=tick<240?1:Math.max(0,1-(tick-240)/90);if(a>0&&!won){g.globalAlpha=a;g.fillStyle='rgba(0,25,45,.55)';g.fillRect(36,6,248,16);g.fillStyle='#e8fbff';g.font='bold 9px monospace';g.fillText('WASD/ARROWS to move, left click to interact',160,17);g.globalAlpha=1}}
